name: 🚀 Publish Library Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # 👈 CRITICAL: Allows GitHub to request temporary OIDC tokens from npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js 26
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Library
        run: npm run build-lib

      - name: Verify Build Output
        run: |
            echo "Current directory structure:"
            ls -R dist/ || echo "dist folder not found!"

      - name: Check if Beta Release
        id: check-tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "NPM_TAG=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-alpha"* ]]; then
            echo "NPM_TAG=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *"-next"* ]]; then
            echo "NPM_TAG=next" >> $GITHUB_OUTPUT
          else
            echo "NPM_TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Upgrade npm to 11.16.0
        # npm stage publish requires npm >= 11.16.0, newer than the npm bundled with Node 26.
        run: npm install -g npm@11.16.0

      - name: Authenticate to npm via OIDC (Trusted Publishing)
        # Uses GitHub Actions OIDC to request a temporary token from npm. The
        # workflow already requests `id-token: write` in permissions.
        run: |
          echo "Attempting OIDC authentication to npm..."
          # Ensure npm will attempt OIDC auth non-interactively
          npm config set //registry.npmjs.org/:always-auth true
          # npm v11+ supports `--auth-type=oidc` which will exchange the GitHub
          # OIDC token for temporary credentials on the runner.
          npm login --auth-type=oidc --registry=https://registry.npmjs.org/ || true

      - name: Verify npm authentication
        run: |
          echo "Verifying npm authentication..."
          if ! npm whoami >/dev/null 2>&1; then
            echo "Failed to authenticate to npm via OIDC. Check that Trusted Publishing is enabled and 'id-token: write' permission is present." >&2
            exit 1
          fi

      - name: Stage Publish to NPM via Trusted Publishing
        run: |
          cd dist/ng-gallery
          npm stage publish --tag ${{ steps.check-tag.outputs.NPM_TAG }} --provenance
