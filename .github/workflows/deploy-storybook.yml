name: Deploy Storybook Lifecycle

on:
  # Every push to master updates the preview channel (/next)
  push:
    branches:
      - master

  # Published GitHub releases create immutable versioned docs
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      ######################################################################
      # CHECKOUT
      ######################################################################

      # Push builds use the latest master commit
      - name: Checkout Branch
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      # Release builds use the exact tag being released
      # This prevents accidentally deploying newer master code.
      - name: Checkout Release Tag
        if: github.event_name == 'release'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      ######################################################################
      # NODE SETUP
      ######################################################################

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      ######################################################################
      # RELEASE SAFETY CHECK
      ######################################################################

      # Ensures the GitHub release tag matches the library version.
      #
      # Example:
      #   package.json = 13.0.0
      #   tag          = v13.0.0
      #
      # This prevents accidental mismatches.
      - name: Validate Release Version
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./projects/ng-gallery/package.json').version")

          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"

          if [ "$VERSION" != "$TAG" ]; then
            echo "ERROR: package version ($VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      ######################################################################
      # COMPUTE TARGET DIRECTORY
      ######################################################################

      - name: Compute Target Directory
        id: target-env
        run: |
          VERSION=$(node -p "require('./projects/ng-gallery/package.json').version")

          echo "actual_version=$VERSION" >> $GITHUB_OUTPUT

          # All pushes always go to /next
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "dir=next" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT

          # Release tag contains prerelease identifier
          elif [[ "$VERSION" == *"-"* ]]; then
            echo "dir=next" >> $GITHUB_OUTPUT
            echo "is_stable=false" >> $GITHUB_OUTPUT

          # Stable release gets its own immutable version folder
          else
            echo "dir=$VERSION" >> $GITHUB_OUTPUT
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi

      ######################################################################
      # BUILD STORYBOOK
      ######################################################################

      - name: Build Storybook
        run: npm run storybook-build

      ######################################################################
      # STAGE FILES
      ######################################################################

      - name: Stage Storybook Assets
        run: |
          mkdir -p "./deploy-staging/${{ steps.target-env.outputs.dir }}"
          cp -r ./dist/storybook/ng-gallery/* "./deploy-staging/${{ steps.target-env.outputs.dir }}/"

      ######################################################################
      # BUILD versions.json
      ######################################################################

      - name: Generate Versions Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIRS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents?ref=gh-pages" \
            | node -e "
              const fs = require('fs');

              try {
                const input = JSON.parse(fs.readFileSync(0, 'utf8'));

                if (!Array.isArray(input)) {
                  console.log(JSON.stringify([]));
                } else {
                  console.log(JSON.stringify(
                    input
                      .filter(x => x.type === 'dir')
                      .map(x => x.name)
                  ));
                }
              } catch {
                console.log(JSON.stringify([]));
              }
            ")

          TARGET_DIR="${{ steps.target-env.outputs.dir }}"
          ACTUAL_VERSION="${{ steps.target-env.outputs.actual_version }}"

          node -e "
            const fs = require('fs');

            const dirs = $DIRS;

            if (!dirs.includes('$TARGET_DIR')) {
              dirs.push('$TARGET_DIR');
            }

            const manifest = dirs.map(dir => {
              if (dir === 'next') {
                return {
                  path: 'next',
                  version: dir === '$TARGET_DIR'
                    ? '$ACTUAL_VERSION'
                    : '0.0.0-next'
                };
              }
              // Since stable folder matches version name exactly, path and version string properties are identical
              return { path: dir, version: dir };
            });

              return {
                path: dir,
                version: dir
              };
            });

            function core(v) {
              return (v || '0.0.0')
                .split('-')[0]
                .split('.')
                .map(n => parseInt(n, 10) || 0);
            }

            manifest.sort((a, b) => {
              if (a.path === 'next') return -1;
              if (b.path === 'next') return 1;

              const pa = core(a.version);
              const pb = core(b.version);

              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const ai = pa[i] || 0;
                const bi = pb[i] || 0;

                if (ai !== bi) {
                  return bi - ai;
                }
              }

              return 0;
            });

            fs.writeFileSync(
              './deploy-staging/versions.json',
              JSON.stringify(manifest, null, 2)
            );
          "

      ######################################################################
      # ROOT REDIRECT
      #
      # Rules:
      # - If next > latest stable => root redirects to next
      # - Otherwise root redirects to latest stable
      ######################################################################

      - name: Generate Root Redirect
        run: |
          node -e "
            const fs = require('fs');
            const versions = JSON.parse(
              fs.readFileSync('./deploy-staging/versions.json', 'utf8')
            );

            const next = versions.find(v => v.path === 'next');
            const stable = versions.filter(v => v.path !== 'next');

            function core(v) {
              return (v || '0.0.0')
                .split('-')[0]
                .split('.')
                .map(n => parseInt(n, 10) || 0);
            }

            function compare(a, b) {
              const pa = core(a);
              const pb = core(b);

              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const ai = pa[i] || 0;
                const bi = pb[i] || 0;

                if (ai !== bi) {
                  return ai - bi;
                }
              }

              return 0;
            }

            let target = 'next';

            const latestStable = stable
              .slice()
              .sort((a,b) => compare(b.version,a.version))[0];

            if (next && latestStable) {
              target =
                compare(next.version, latestStable.version) > 0
                  ? 'next'
                  : latestStable.path;
            } else if (latestStable) {
              target = latestStable.path;
            }

            fs.writeFileSync(
              './deploy-staging/index.html',
              '<!DOCTYPE html><html><head><script>' +
              'window.location.replace(\"/ngx-gallery/' + target + '/\");' +
              '</script></head><body>Redirecting...</body></html>'
            );

            fs.writeFileSync(
              './deploy-staging/404.html',
              '<!DOCTYPE html><html><head><script>' +
              'window.location.replace(\"/ngx-gallery/\");' +
              '</script></head><body>Redirecting...</body></html>'
            );
          "

      ######################################################################
      # DEPLOY
      ######################################################################

      - name: Deploy To GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./deploy-staging
          target-folder: .
          clean: false
